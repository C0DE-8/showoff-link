<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0b18">
  <title>Page not found — Showoff Links</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d0b18; color: #f3e8ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, rgba(168,85,247,.18), transparent 44%), #0d0b18; }
    main { width: min(100%, 520px); padding: clamp(28px, 7vw, 52px); text-align: center; border: 1px solid rgba(216,180,254,.2); border-radius: 24px; background: rgba(22,19,38,.72); box-shadow: 0 28px 90px rgba(0,0,0,.42); backdrop-filter: blur(24px) saturate(145%); }
    .code { margin: 0; color: #c084fc; font-size: clamp(76px, 20vw, 132px); font-weight: 850; letter-spacing: -.09em; line-height: .95; }
    h1 { margin: 22px 0 10px; font-size: clamp(23px, 5vw, 30px); }
    p { margin: 0 auto 28px; max-width: 360px; color: #b8accb; line-height: 1.65; }
    a { display: inline-flex; justify-content: center; padding: 12px 20px; border: 1px solid rgba(216,180,254,.3); border-radius: 11px; color: #1b1025; background: #c084fc; font-weight: 750; text-decoration: none; transition: transform .18s, background .18s; }
    a:hover { transform: translateY(-2px); background: #d8b4fe; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-label="Error 404">404</p>
    <h1>This page wandered off</h1>
    <p>The link may be outdated, or the page may have moved. Head back to Showoff Links and try again.</p>
    <a href="./index.html">Go to home</a>
  </main>
</body>
</html>
