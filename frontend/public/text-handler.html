<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quote Vault</title>
  <script defer src="/script/uploadNote.js"></script>
  <style>
    /* Global Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      background-color: #05070c;
      color: #f3f4f6;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Background Grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      z-index: 0;
      pointer-events: none;
    }

    /* Main Canvas App Container */
    .cipher-app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 640px) {
      .cipher-app {
        min-height: auto;
        padding: 32px 0;
      }
    }

    /* Header Bar */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f9fafb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-pulse {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }

    .token-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #c084fc;
      backdrop-filter: blur(8px);
    }

    /* Form Workspace */
    .editor-stage {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-grow: 1;
    }

    /* Quote Text Input Canvas */
    .textarea-wrapper {
      position: relative;
      width: 100%;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 20px 36px 20px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(12px);
    }

    .textarea-wrapper:focus-within {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .textarea-wrapper.limit-exceeded {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
    }

    textarea {
      width: 100%;
      height: 120px;
      background: transparent;
      border: none;
      outline: none;
      color: #f3f4f6;
      font-size: 1.1rem;
      font-style: italic;
      line-height: 1.6;
      resize: none;
    }

    textarea::placeholder {
      color: #4b5563;
      font-style: normal;
    }

    .character-count {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.75rem;
      color: #6b7280;
      font-family: monospace;
      transition: color 0.2s ease;
    }

    .character-count.warning {
      color: #f59e0b;
    }

    .character-count.exceeded {
      color: #ef4444;
      font-weight: bold;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 500px) {
      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      color: #f3f4f6;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .views-counter {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .counter-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      width: 44px;
      height: 42px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .counter-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f3f4f6;
    }

    .views-input {
      border: none;
      text-align: center;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
      padding: 0;
    }

    /* Submit CTA Button */
    .submit-btn {
      position: relative;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c084fc 0%, #c084fc 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.3);
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(2, 132, 199, 0.45);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Status Toast Banners */
    .status-toast {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .status-toast.error {
      display: flex;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* Success Modal View Overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .success-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
    }

    .success-icon {
      width: 48px;
      height: 48px;
      background: rgba(56, 189, 248, 0.15);
      color: #c084fc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.5rem;
    }

    .url-box {
      display: flex;
      gap: 8px;
      margin: 16px 0;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .url-input {
      background: transparent;
      border: none;
      outline: none;
      color: #c084fc;
      font-family: monospace;
      font-size: 0.85rem;
      width: 100%;
    }

    .copy-btn {
      background: #c084fc;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dismiss-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #9ca3af;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <main class="cipher-app">
    
    <!-- Top Bar -->
    <header class="app-header">
      <div class="brand-title">
        <span class="brand-pulse"></span>
        Quote Vault
      </div>
      <div class="token-chip">
         1 Token
      </div>
    </header>

    <!-- Main Form -->
    <form id="uploadNoteForm" class="editor-stage">
      
      <!-- Quote Input Box -->
      <div class="textarea-wrapper" id="textareaWrapper">
        <textarea 
          id="noteContent" 
          placeholder="“Enter a punchy quote or secret message...”" 
          maxlength="280"
          required
        ></textarea>
        <span class="character-count" id="charCount">0 / 280</span>
      </div>

      <!-- Controls Row -->
      <div class="controls-grid">
        
        <!-- Recipient Tag Field -->
        <div class="control-group">
          <label class="control-label" for="recipientTag">
             Tagname
          </label>
          <input 
            type="text" 
            id="recipientTag" 
            class="input-field" 
            placeholder="@tagname (optional)" 
            maxlength="30"
            autocomplete="off" 
          />
        </div>

        <!-- Allowed Views Counter -->
        <div class="control-group">
          <label class="control-label" for="allowedViews">
             max views <span>20</span>
          </label>
          <div class="views-counter">
            <button type="button" class="counter-btn" id="decrementViews">-</button>
            <input 
              type="number" 
              id="allowedViews" 
              class="input-field views-input" 
              value="1" 
              min="1" 
              max="20" 
              readonly 
            />
            <button type="button" class="counter-btn" id="incrementViews">+</button>
          </div>
        </div>

      </div>

      <!-- Error Toast -->
      <div id="statusToast" class="status-toast"></div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        Encrypt & Publish Quote
      </button>

    </form>
  </main>

  <!-- Success Modal -->
  <div id="successOverlay" class="success-overlay">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h3 style="margin-bottom: 8px;">Quote Encrypted</h3>
      <p style="font-size: 0.85rem; color: #9ca3af;">Your short payload is sealed and ready to share.</p>
      
      <div class="url-box">
        <input type="text" id="shareUrlInput" class="url-input" readonly />
        <button id="copyUrlBtn" class="copy-btn">Copy</button>
      </div>

      <button id="dismissModalBtn" class="dismiss-btn">Create Another Quote</button>
    </div>
  </div>

  
</body>
</html>
