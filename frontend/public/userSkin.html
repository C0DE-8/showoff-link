<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skins Inventory</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --equipped-border: #10b981;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: color 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    h1 {
      margin-top: 0.5rem;
      font-size: 2rem;
    }

    /* Feedback Banner */
    #status-msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      font-size: 0.95rem;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }

    /* Responsive Grid */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    /* Skin Card Styling */
    .skin-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .skin-card:hover {
      transform: translateY(-4px);
    }

    .skin-card.equipped {
      border-color: var(--equipped-border);
    }

    .equipped-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--equipped-border);
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .skin-img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      margin-bottom: 1rem;
      border-radius: 8px;
    }

    .skin-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
    }

    .equip-btn {
      width: 100%;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: auto;
    }

    .equip-btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .equip-btn:disabled {
      background-color: #334155;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Loader / Empty States */
    .state-container {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem 0;
      color: var(--text-muted);
    }
    h4{
      text-align: center;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <a href="/dashboard.html" class="back-btn">
          <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          Back to Dashboard
        </a>
        
      </div>
    </header>
    <h4>Your Skin Inventory</h4>

<div id="status-msg"></div>

    <main class="inventory-grid" id="inventory-grid">
      <div class="state-container">Loading skins...</div>
    </main>
  </div>

  <script src="script/inventory.js"></script>
</body>
</html>
