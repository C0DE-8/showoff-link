<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift token</title>
  <style>
    :root {
      --primary: #c084fc;
      --primary-hover: #a855f7;
      --primary-glow: rgba(192, 132, 252, 0.25);
      --surface: #171b2e;
      --border: #292d42;
      --border-focus: #474d6b;
      --text: #f4f4f5;
      --text-muted: #8e95b0;
      --success: #34d399;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #090d16 0%, #111424 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2.5rem;
      position: relative;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 2rem;
      transition: color 0.2s ease;
      width: fit-content;
    }

    .back-link:hover {
      color: var(--primary);
    }

    .panel-block {
      width: 100%;
      max-width: 480px;
    }

    .panel-header {
      margin-bottom: 2rem;
      border-left: 3px solid var(--primary);
      padding-left: 1rem;
    }

    .panel-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .panel-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    #giftForm {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #5c627a;
    }

    input:hover {
      border-color: var(--border-focus);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .btn-accent {
      margin-top: 0.75rem;
      background: var(--primary);
      color: #090d16;
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: capitalize;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-accent:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .btn-accent:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-accent:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Button Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(9, 13, 22, 0.2);
      border-top-color: #090d16;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

/* Toast Container & Notification Styles */
    #toastContainer {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 280px;
      padding: 0.875rem 1.25rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      border-left: 4px solid var(--success);
    }

    .toast-error {
      border-left: 4px solid var(--error);
    }
  </style>
  <script src="./api/api.js"></script>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toastContainer"></div>

  <a href="./dashboard.html" class="back-link">&larr; Back to dashboard</a>

  <!-- Panel 2: Peer Token Transfer Terminal -->
  <section class="panel-block">
    <div>
      <div class="panel-header">
        <h2>Gift tokens</h2>
        <p>Directly transfer platform asset tokens to another peer account.</p>
      </div>
      <form id="giftForm">
        <div class="form-group">
          <label for="inpGiftRecipient">Recipient tagname</label>
          <input type="text" id="inpGiftRecipient" placeholder="recipient_handle" required>
        </div>
        <div class="form-group">
          <label for="inpGiftAmount">token Volume</label>
          <input type="number" id="inpGiftAmount" placeholder="Number of tokens" min="1" required>
        </div>
        <div class="form-group">
          <label for="inpGiftPassword">Account Password </label>
          <input type="password" id="inpGiftPassword" placeholder="Confirm password to authorize" required>
        </div>
        <button type="submit" id="btnGift" class="btn btn-accent">send</button>
      </form>
    </div>
  </section>

  <script src="script/giftToken.js"></script>

  

</body>
</html>
