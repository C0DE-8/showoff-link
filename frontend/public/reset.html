<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-sizing: border-box; border: 1px solid #334155; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    button.submit-btn { width: 100%; padding: 12px; background: #c084fc; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; }
    .alert-error { background: #7f1d1d; color: #fca5a5; }
    .alert-success { background: #064e3b; color: #6ee7b7; }
  </style>
</head>
<body>

  <div class="card">
    <h3>Reset Password</h3>
    <div id="alert" class="alert"></div>
    <form onsubmit="handleReset(event)">
      <div class="input-group">
        <label>New Secure Password</label>
        <input type="password" id="newPassword" required>
      </div>
      <button type="submit" class="submit-btn">Change Password</button>
    </form>
  </div>

  <script>
    async function handleReset(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alert');
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: newPassword.value })
        });
        const data = await res.json();
        if(res.ok) {
          alertBox.className = "alert alert-success";
          alertBox.innerText = "Password updated! Going back to login page...";
          alertBox.style.display = "block";
          setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
          alertBox.className = "alert alert-error";
          alertBox.innerText = data.error;
          alertBox.style.display = "block";
        }
      } catch { alertBox.innerText = "Connection error."; alertBox.style.display = "block"; }
    }
  </script>
</body>
</html>
